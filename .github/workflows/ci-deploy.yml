name: CI and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks and build
        run: npm run ci

  deploy:
    name: Deploy free Worker
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          missing=''
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETTER_AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Worker deployment skipped; configure these Actions values:$missing"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Check out source
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
      - name: Set up Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        if: steps.credentials.outputs.ready == 'true'
        run: npm ci
      - name: Prepare deployment configuration
        if: steps.credentials.outputs.ready == 'true'
        run: cp deployment/config.free.example.json deployment/config.free.local.json
      - name: Create temporary Worker secrets file
        if: steps.credentials.outputs.ready == 'true'
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          umask 077
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';

          const names = ['BETTER_AUTH_SECRET', 'GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET'];
          const missing = names.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error(`Missing GitHub Actions secrets: ${missing.join(', ')}`);
            process.exit(1);
          }
          const values = Object.fromEntries(names.map((name) => [name, process.env[name]]));
          await writeFile('deployment/secrets.free.local.json', JSON.stringify(values), { mode: 0o600 });
          NODE
      - name: Deploy Worker and static assets
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Missing CLOUDFLARE_API_TOKEN secret or CLOUDFLARE_ACCOUNT_ID variable.' >&2
            exit 1
          fi
          npm run prepare:free
          npm run deploy:free -- --secrets-file ../../deployment/secrets.free.local.json
